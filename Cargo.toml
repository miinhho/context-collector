[package]
name = "context-collector"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "context_collector"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }
tiktoken-rs = "0.12.1"
